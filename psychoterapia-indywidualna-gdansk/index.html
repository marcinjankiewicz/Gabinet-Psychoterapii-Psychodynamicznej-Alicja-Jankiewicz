        <h1>Psychoterapia indywidualna w Gdańsku – trwała zmiana w nurcie psychodynamicznym</h1>
        <p>
          Psychoterapia indywidualna w gabinecie Alicji Jankiewicz w Gdańsku (dzielnica Jasień, ul. Kartuska 356a) to bezpieczna, poufna przestrzeń spotkania dla osób dorosłych oraz młodzieży. Pomagam zrozumieć źródła cierpienia, odzyskać wewnętrzną równowagę i budować satysfakcjonujące relacje.
        </p>

        <h2>Kiedy warto rozważyć psychoterapię indywidualną?</h2>
        <ul>
          <li>Zaburzenia lękowe, przewlekły niepokój, napady paniki i napięcie emocjonalne</li>
          <li>Obniżony nastrój, stany depresyjne, utrata energii i poczucie pustki</li>
          <li>Trudności w bliskich relacjach, lęk przed bliskością lub odrzuceniem, problemy ze stawianiem granic</li>
          <li>Zaburzenia osobowości, kryzysy tożsamości i trudności w regulacji emocji</li>
          <li>Objawy psychosomatyczne, przewlekły stres, bezsenność i wypalenie zawodowe</li>
        </ul>

        <h2>Przebieg i zasady współpracy</h2>
        <p>
          Proces rozpoczyna się od 3–5 spotkań konsultacyjnych (50 min / 200 zł), po których wspólnie omawiamy wnioski i ustalamy kontrakt terapeutyczny. Sesje psychoterapii odbywają się regularnie raz lub dwa razy w tygodniu pod stałą superwizją certyfikowanych superwizorów PTP i PTPPd.
        </p>

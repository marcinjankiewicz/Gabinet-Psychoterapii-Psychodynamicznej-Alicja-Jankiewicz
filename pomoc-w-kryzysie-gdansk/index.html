        <h1>Pomoc psychologiczna w kryzysie w Gdańsku – bezpieczna przystań w trudnym momencie życia</h1>
        <p>
          W gabinecie w Gdańsku (ul. Kartuska 356a, dzielnica Jasień) Alicja Jankiewicz oferuje empatyczną, profesjonalną pomoc psychologiczną i krótkoterminowe wsparcie w kryzysie dla osób dorosłych oraz młodzieży.
        </p>

        <h2>W jakich sytuacjach warto skorzystać z pomocy w kryzysie?</h2>
        <ul>
          <li>Żałoba, strata bliskiej osoby lub trudne pożegnania</li>
          <li>Rozstanie, rozwód, zdrada i nagły kryzys w relacji</li>
          <li>Utrata pracy, mobbing, wypalenie zawodowe i nagłe zmiany życiowe</li>
          <li>Kryzysy rozwojowe i punkty zwrotne (np. kryzys okołoporodowy)</li>
          <li>Przeciążenie emocjonalne, bezsenność i poczucie bezradności</li>
        </ul>

        <h2>Jak przebiega wsparcie kryzysowe?</h2>
        <p>
          Wsparcie w kryzysie ma charakter krótkoterminowy (zazwyczaj od kilku do kilkunastu 50-minutowych spotkań, koszt 200 zł za wizytę) i koncentruje się na obniżeniu ostrego napięcia, uporządkowaniu sytuacji oraz odbudowaniu poczucia oparcia.
        </p>

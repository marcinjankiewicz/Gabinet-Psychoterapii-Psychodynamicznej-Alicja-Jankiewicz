name: Update and Upload Sitemap to Seohost

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *' # Codziennie o 3:00 nad ranem

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci || npm install

      - name: Generate fresh sitemap from Firebase
        run: npm run generate:sitemap

      - name: Prepare isolated directory for FTP upload
        run: |
          mkdir -p sitemap-dist
          cp public/sitemap.xml sitemap-dist/sitemap.xml

      - name: Sync sitemap.xml to Seohost FTP
        if: ${{ secrets.FTP_SERVER != '' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.SEO_HOST_AJ }}
          protocol: ftp
          port: 21
          local-dir: ./sitemap-dist/
          server-dir: ./domains/gabinetpsychologagdansk.pl/public_html/
          state-name: .ftp-deploy-sync-state-sitemap.json
          dangerous-clean-slate: false

      - name: Commit updated sitemap.xml to repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet public/sitemap.xml || (git add public/sitemap.xml && git commit -m "chore(seo): automatyczna aktualizacja sitemap.xml z Firebase" && git push)
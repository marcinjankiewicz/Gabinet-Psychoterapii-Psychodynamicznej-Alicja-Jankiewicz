        <h1>Psycholog dziecięcy i psychoterapia młodzieży w Gdańsku – mądre wsparcie w rozwoju</h1>
        <p>
          W gabinecie w Gdańsku (ul. Kartuska 356a, dzielnica Jasień) Alicja Jankiewicz oferuje pomoc psychologiczną oraz psychoterapię indywidualną dla dzieci i nastolatków, a także konsultacje wspierające dla rodziców w atmosferze zrozumienia, szacunku i bezpieczeństwa.
        </p>

        <h2>Jakie sygnały u dziecka lub nastolatka warto skonsultować?</h2>
        <ul>
          <li>Smutek, wycofanie, spadek nastroju i utrata dotychczasowych zainteresowań</li>
          <li>Lęki szkolne, separacyjne i społeczne oraz silny stres przed oceną</li>
          <li>Trudności w regulacji emocji, wybuchy złości, drażliwość lub niskie poczucie własnej wartości</li>
          <li>Kryzysy rówieśnicze, odrzucenie, trudności ze zmianą szkoły lub przeprowadzką</li>
          <li>Trudne zmiany w rodzinie (rozwód, rozstanie, żałoba, choroba bliskiej osoby)</li>
          <li>Objawy psychosomatyczne i problemy ze snem</li>
        </ul>

        <h2>Jak wygląda proces konsultacji i terapii?</h2>
        <p>
          W przypadku młodszych dzieci pierwsze spotkanie odbywa się zazwyczaj z samymi rodzicami, po czym następują spotkania z dzieckiem i omówienie planu pomocy. Gabinet działa w pełnej zgodności ze Standardami Ochrony Małoletnich (SOM). Spotkanie trwa 50 minut (200 zł).
        </p>

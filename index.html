          Prywatny gabinet psychologiczny i psychoterapeutyczny w Gdańsku (dzielnica Jasień, ul. Kartuska 356a).
          Alicja Jankiewicz — psycholog, psychoterapeuta psychodynamiczny — oferuje bezpieczną, dyskretną pomoc dla osób dorosłych, młodzieży oraz dzieci z Gdańska (Jasień, Morena, Piecki-Migowo, Wrzeszcz, Oliwa), Sopotu i Gdyni.
        </p>

        <h2>Kwalifikacje i etyka pracy</h2>
        <p>
          Alicja Jankiewicz jest absolwentką psychologii klinicznej na Uniwersytecie Gdańskim oraz ukończyła całościowe, 4-letnie szkolenie psychoterapeutyczne w Krakowskim Centrum Psychodynamicznym (rekomendowanym przez Polskie Towarzystwo Psychologiczne). Jest aktywnym członkiem Polskiego Towarzystwa Psychoterapii Psychodynamicznej (PTPPd). Swoją pracę prowadzi zgodnie z kodeksem etycznym, z zachowaniem tajemnicy zawodowej oraz pod stałą, regularną superwizją certyfikowanych superwizorów PTP.
        </p>

          <li>Trudności w relacjach, związkach i stawianiu granic oraz zaburzenia osobowości</li>

          <li>Trudności emocjonalne i rozwojowe dzieci i młodzieży oraz konsultacje dla rodziców</li>
